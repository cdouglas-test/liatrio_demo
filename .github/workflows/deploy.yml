name: Deploy

# Builds the image, pushes it to ECR, and rolls it out to EKS.
# Requires the infrastructure stack to already be applied, and these
# variables on the "dev" environment:
#   AWS_ROLE_ARN     IAM role to assume through GitHub OIDC
#   TF_STATE_BUCKET  bucket created by infrastructure/bootstrap

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: dev-environment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - name: Read infrastructure outputs
        id: tf
        working-directory: infrastructure
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          echo "cluster=$(terraform output -raw eks_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "repository=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        run: |
          tag="${GITHUB_SHA::7}"
          image="${{ steps.tf.outputs.repository }}:${tag}"
          docker build -t "$image" app
          docker push "$image"
          echo "uri=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Roll out to EKS
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "${{ steps.tf.outputs.cluster }}"
          sed -e "s|IMAGE_URI|${{ steps.image.outputs.uri }}|" \
              -e "s|value: APP_VERSION|value: \"${{ steps.image.outputs.tag }}\"|" \
              k8s/deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/liatrio-demo-api --timeout=300s

      - name: Smoke test
        run: |
          for _ in $(seq 1 60); do
            host=$(kubectl get service liatrio-demo-api -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            [ -n "$host" ] && curl -fsS "http://$host/health" > /dev/null 2>&1 && break
            sleep 10
          done
          [ -n "$host" ] || { echo "Load balancer hostname was never assigned"; exit 1; }

          curl -fsS "http://$host/api" | jq -e '.message == "Automate all the things!"'
          curl -fsS "http://$host/version" | jq -e ".version == \"${{ steps.image.outputs.tag }}\""
          echo "Deployed to http://$host" >> "$GITHUB_STEP_SUMMARY"
