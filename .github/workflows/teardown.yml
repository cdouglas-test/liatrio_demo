name: Teardown

# Deletes the application and destroys the infrastructure stack.
# The state bucket from infrastructure/bootstrap is left in place; remove it
# with `terraform destroy` in that directory once nothing else needs it.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DESTROY to confirm
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: dev-environment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  teardown:
    if: inputs.confirm == 'DESTROY'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infrastructure
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      # The load balancer is created by Kubernetes, not Terraform. It has to be
      # gone before the VPC can be destroyed.
      - name: Delete application
        run: |
          cluster=$(terraform -chdir=infrastructure output -raw eks_cluster_name 2>/dev/null || true)
          if [ -z "$cluster" ]; then
            echo "No cluster in state, skipping"
            exit 0
          fi
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$cluster"
          kubectl delete -f k8s/deployment.yaml --ignore-not-found --wait --timeout=300s

      - name: Terraform destroy
        working-directory: infrastructure
        run: terraform destroy -auto-approve -input=false
