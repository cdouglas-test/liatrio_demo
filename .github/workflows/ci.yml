name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt pip-audit

      - name: Run tests
        run: pytest

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t liatrio-demo-api:ci app

      - name: Smoke test
        run: |
          docker run -d --name api -p 8080:8080 liatrio-demo-api:ci
          trap 'docker logs api; docker rm -f api' EXIT

          for _ in $(seq 1 15); do
            curl -fsS http://localhost:8080/health > /dev/null && break
            sleep 2
          done

          curl -fsS http://localhost:8080/health | jq -e '.status == "healthy"'
          curl -fsS http://localhost:8080/api | jq -e '.message == "Automate all the things!"'

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Format
        run: terraform fmt -check -recursive infrastructure

      - name: Validate
        run: |
          for dir in infrastructure infrastructure/bootstrap; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.3

      - name: Lint
        run: |
          tflint --init
          tflint --chdir=infrastructure -f compact
          tflint --chdir=infrastructure/bootstrap -f compact
