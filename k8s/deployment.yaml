apiVersion: apps/v1
kind: Deployment
metadata:
  name: liatrio-demo-api
  labels:
    app: liatrio-demo-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: liatrio-demo-api
  template:
    metadata:
      labels:
        app: liatrio-demo-api
    spec:
      containers:
        - name: api
          image: IMAGE_URI
          ports:
            - containerPort: 8080
          env:
            - name: ENVIRONMENT
              value: dev
            - name: APP_VERSION
              value: APP_VERSION
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: liatrio-demo-api
  labels:
    app: liatrio-demo-api
spec:
  type: LoadBalancer
  selector:
    app: liatrio-demo-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
